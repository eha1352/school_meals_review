<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 급식 리뷰</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🍚 급식 리뷰</h1>
</header>

<main class="container">

    <h2>회원가입</h2>

    <form id="signupForm">

        <label>이름</label>
        <input
            type="text"
            id="name"
            placeholder="실명을 입력하세요"
            required
        >

        <label>학번</label>
        <input
            type="text"
            id="studentNumber"
            placeholder="예: 10101"
            maxlength="5"
            required
        >

        <p class="help">
            학번은 5자리 숫자로 입력하세요. (예: 1학년 1반 1번 → 10101)
        </p>

        <label>별명</label>
        <input
            type="text"
            id="nickname"
            placeholder="다른 사람에게 표시될 별명"
            minlength="2"
            maxlength="12"
            required
        >
        <small>별명은 2~12글자 내로 입력해주세요.</small>

        <label>비밀번호</label>
        <input
            type="password"
            id="password"
            placeholder="비밀번호"
            minlength="6"
            required
        >

        <button type="submit">회원가입</button>

    </form>

    <p id="message"></p>

    <p>
        이미 계정이 있나요?
        <a href="login.html">로그인</a>
    </p>

</main>

<script type="module" src="js/signup.js"></script>

</body>
</html>
